<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deklaro</title>
<meta name="description" content="Deklaro — kontakta oss på kontakt@deklaro.se">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f1115'/><text x='32' y='45' font-family='Georgia,serif' font-size='40' fill='%23f2f0ec' text-anchor='middle'>D</text></svg>">
<style>
  :root {
    --bg: #0f1115;
    --fg: #f2f0ec;
    --muted: #8b8f98;
    --rule: #262a32;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    text-align: center;
    max-width: 34rem;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.5rem, 13vw, 6rem);
    font-weight: 500;
    letter-spacing: 0.22em;
    text-indent: 0.22em; /* offset trailing letter-space so it stays optically centred */
    line-height: 1.05;
  }
  hr {
    width: 3rem;
    margin: 2.25rem auto;
    border: 0;
    border-top: 1px solid var(--rule);
  }
  a {
    color: var(--muted);
    font-size: clamp(0.9rem, 3.5vw, 1.05rem);
    letter-spacing: 0.05em;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  a:hover, a:focus-visible {
    color: var(--fg);
    border-bottom-color: var(--rule);
  }
</style>
</head>
<body>
  <main>
    <h1>DEKLARO</h1>
    <hr>
    <a href="mailto:kontakt@deklaro.se">kontakt@deklaro.se</a>
  </main>
</body>
</html>
